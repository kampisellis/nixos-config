name: Update Stable Flake Input

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-nixpkgs:
    name: Update nixpkgs (stable only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update stable nixpkgs input only
        run: nix flake update nixpkgs

      - name: Verify evaluation after update
        run: nix flake check --no-build --show-trace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(flake): update nixpkgs input"
          title: "chore(flake): weekly nixpkgs update"
          body: |
            Automated weekly update of the stable `nixpkgs` input only.
            `nixpkgs-unstable` is intentionally excluded to prevent unintended DB-backed service upgrades (Immich, NetBird).

            Review the diff and test on `homelab` with:
            ```bash
            just diff homelab
            just test homelab
            ```
          branch: chore/update-nixpkgs
          delete-branch: true
